[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pdb-select"
version = "0.1.0"
authors = [
  {name = "Joe Hoye Dow", email = "luxunisgod123@gmail.com"}
  ] 
description = "PDB file segmentation tool, extract specific chains and residue ranges from PDB/MMCIF files."
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent"
]


# use pip show to check
dependencies = [
  "biopython>=1.87", 
  "typer>=0.27.1", 
]

[project.urls]
Homepage = "https://github.com/MaybeBio/pdb-select"
Issues = "https://github.com/MaybeBio/pdb-select/issues"

[project.scripts]                                                                                            
pdb-select = "pdb_select.cli:app"

[tool.hatch.build.targets.wheel]                                                                             
packages = ["pdb_select"]