[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pdb-md"
version = "0.2.1"
authors = [
  {name = "Joe Hoye Dow", email = "luxunisgod123@gmail.com"}
  ]
description = "Pre- and post-processing toolkit for PDB/MMCIF structure files in molecular dynamics workflows."
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent"
]


# use pip show to check
dependencies = [
  "biopython>=1.87", 
  "typer>=0.27.1", 
]

[project.urls]
Homepage = "https://github.com/MaybeBio/PDB-MD-Suite"
Issues = "https://github.com/MaybeBio/PDB-MD-Suite/issues"

[project.scripts]                                                                                            
pdb-md = "pdb_md.cli:app"

[tool.hatch.build.targets.wheel]                                                                             
packages = ["pdb_md"]